<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Cumpleaños Marylin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07030a; }
  body { background: radial-gradient(circle at 50% 38%, #1c0a22 0%, #07030a 75%); font-family: 'Quicksand', sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #f { z-index: 10; pointer-events: none; }
  .core { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 5; }
  .core h1 { margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: 32px; line-height: 1; color: #ffe27a; text-shadow: 0 0 14px #ff4f9a, 0 0 34px #ff4f9a; white-space: nowrap; animation: glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 8px #ff4f9a, 0 0 20px #ff4f9a; } to { text-shadow: 0 0 18px #ff79b4, 0 0 48px #ff4f9a; } }
  #btn { pointer-events: auto; margin-top: .55em; font: 700 16px 'Quicksand', sans-serif; color: #3b0a2a; background: linear-gradient(135deg, #ffe27a, #ff9ec7); border: 0; border-radius: 999px; padding: .5em 1.2em; cursor: pointer; box-shadow: 0 0 18px rgba(255, 79, 154, .6); transition: transform .15s; }
  #btn:hover { transform: scale(1.06); }
  #btn:active { transform: scale(.94); }
  #btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .balloon { position: absolute; animation: bob 4s ease-in-out infinite; z-index: 2; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-20px) rotate(3deg); } }
  .cake { position: absolute; bottom: 1.5%; left: 50%; transform: translateX(-50%); width: clamp(150px, 28vw, 250px); z-index: 2; }
  .flame { transform-origin: 50% 100%; transform-box: fill-box; animation: flick .35s ease-in-out infinite alternate; }
  @keyframes flick { from { transform: scale(1, 1); } to { transform: scale(.8, 1.2); } }
  .popper { position: absolute; bottom: 1.5%; width: clamp(64px, 12vw, 120px); z-index: 3; }
  .popper.left { left: 2%; }
  .popper.right { right: 2%; transform: scaleX(-1); }
  .popper.pop svg { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-4deg); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .balloon, .flame, .core h1, .popper.pop svg { animation: none; } }
</style>
</head>
<body>
<canvas id="h"></canvas>

<div class="core" id="core">
  <h1 id="name">MARYLIN</h1>
  <button id="btn" type="button">¡Click aquí!</button>
</div>

<div id="balloons"></div>
<div class="popper left" id="popL"></div>
<div class="popper right" id="popR"></div>

<svg class="cake" viewBox="0 0 260 240" aria-hidden="true">
  <rect x="6" y="222" width="248" height="12" rx="6" fill="#ffe27a"/>
  <g id="cakeBody"></g>
  <g id="candles"></g>
</svg>

<canvas id="f"></canvas>

<script>
  /* ================= CAMBIA AQUÍ ================= */
  const FRASE = "FELIZ CUMPLEAÑOS  ♥  ";
  const VELOCIDAD = 40;         // qué tan rápido corren las letras
  const ROWS = [                // cada fila: tamaño del corazón y color
    { s: 1.00, color: "#ff4f9a" },
    { s: 0.84, color: "#ff8fc4" },
    { s: 0.68, color: "#ffd1e6" }
  ];
  /* =============================================== */

  const DPR = window.devicePixelRatio || 1;
  const NS = "http://www.w3.org/2000/svg";

  /* ---------- Globos (3 por lado) ---------- */
  const globos = [
    { side: "left",  off: 1,  w: 1.00, bottom: 24, color: "#ff4f9a", delay: 0 },
    { side: "left",  off: 9,  w: 0.85, bottom: 17, color: "#5ec8ff", delay: -1.3 },
    { side: "left",  off: 17, w: 0.95, bottom: 27, color: "#ffe27a", delay: -2.6 },
    { side: "right", off: 1,  w: 1.00, bottom: 24, color: "#b58cff", delay: -0.7 },
    { side: "right", off: 9,  w: 0.85, bottom: 17, color: "#ff4f9a", delay: -2 },
    { side: "right", off: 17, w: 0.95, bottom: 27, color: "#6ee7a8", delay: -3.2 }
  ];
  const bx = document.getElementById("balloons");
  globos.forEach(g => {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 100 190");
    s.setAttribute("class", "balloon");
    s.setAttribute("aria-hidden", "true");
    s.style.cssText = `${g.side}:${g.off}%; bottom:${g.bottom}%; width:calc(clamp(46px, 9vw, 100px) * ${g.w}); animation-delay:${g.delay}s`;
    s.innerHTML = `<path d="M50 4C20 4 6 30 10 58c4 28 26 48 40 52 14-4 36-24 40-52C94 30 80 4 50 4z" fill="${g.color}"/>
      <ellipse cx="32" cy="34" rx="9" ry="16" fill="#fff" opacity=".35" transform="rotate(20 32 34)"/>
      <path d="M44 110h12l-6 10z" fill="${g.color}"/>
      <path d="M50 120c-10 20 10 35 0 68" stroke="#ffd1e6" stroke-width="2" fill="none"/>`;
    bx.appendChild(s);
  });

  /* ---------- Cornetas de fiesta (de aquí sale el confeti) ---------- */
  const popperSVG = `<svg viewBox="0 0 120 112" aria-hidden="true">
    <path d="M70 34q8-26-4-32" stroke="#7a4f9e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 40q-10-12 4-24" stroke="#ffb22e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M96 52q14-10 6-22" stroke="#ffb22e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffb22e"/>
    <path d="M18 34l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#ff4f9a"/>
    <circle cx="96" cy="14" r="4" fill="#ffb22e"/><circle cx="106" cy="92" r="4.5" fill="#ff4f9a"/>
    <g transform="translate(14 100) rotate(-40)">
      <path d="M0 0L80-30A12 30 0 0 1 80 30Z" fill="#5f9ef5"/>
      <path d="M22-8.25L34-12.75V12.75L22 8.25Z M46-17.25L58-21.75V21.75L46 17.25Z" fill="#ff5f9e"/>
      <ellipse cx="80" cy="0" rx="12" ry="30" fill="#4a6fc9"/>
      <path d="M14-6L60-22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <circle class="mouth" cx="80" cy="0" r="1" fill="none"/>
    </g></svg>`;
  document.getElementById("popL").innerHTML = popperSVG;
  document.getElementById("popR").innerHTML = popperSVG;

  /* ---------- Torta de 3 pisos ---------- */
  const body = document.getElementById("cakeBody");
  const tiers = [
    { x: 20, y: 160, w: 220, h: 62, c: "#ff7fb5", f: "#ffffff" },
    { x: 48, y: 110, w: 164, h: 50, c: "#ffb3d1", f: "#ffffff" },
    { x: 76, y: 62,  w: 108, h: 48, c: "#fff0f6", f: "#ff7fb5" }
  ];
  let svgBody = "";
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const sprinkleColors = ["#ffe27a", "#5ec8ff", "#b58cff", "#6ee7a8", "#ff4f9a"];
  tiers.forEach(t => {
    svgBody += `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="8" fill="${t.c}"/>`;
    svgBody += `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="7" rx="3" fill="${t.f}"/>`;
    const n = Math.floor(t.w / 18), sp = t.w / n;
    for (let i = 0; i < n; i++) svgBody += `<circle cx="${t.x + sp / 2 + i * sp}" cy="${t.y + 7}" r="${sp / 2 - 0.5}" fill="${t.f}"/>`;
    for (let i = 0; i < 12; i++) {
      const sx = t.x + 8 + rnd() * (t.w - 16), sy = t.y + 22 + rnd() * (t.h - 30);
      svgBody += `<rect x="${sx}" y="${sy}" width="6" height="2.4" rx="1.2" fill="${sprinkleColors[i % 5]}" transform="rotate(${rnd() * 180} ${sx} ${sy})"/>`;
    }
  });
  [[34,154],[226,154],[62,104],[198,104]].forEach(([x, y]) => {
    svgBody += `<circle cx="${x}" cy="${y}" r="8" fill="#e8143c"/><circle cx="${x - 3}" cy="${y - 3}" r="2.2" fill="#fff" opacity=".7"/><path d="M${x} ${y - 8}q4 -8 9 -9" stroke="#3aa55d" stroke-width="2" fill="none"/>`;
  });
  body.innerHTML = svgBody;

  const candles = document.getElementById("candles");
  let cs = "";
  for (let i = 0; i < 7; i++) {
    const x = 88 + i * 15, col = i % 2 ? "#5ec8ff" : "#ffd1e6";
    cs += `<rect x="${x - 3}" y="38" width="6" height="24" rx="2" fill="${col}"/>
           <g class="flame" style="animation-delay:${-(i * 0.11).toFixed(2)}s"><path d="M${x} 24c-6 8-4 13 0 13s6-5 0-13z" fill="#ffb22e"/><path d="M${x} 29c-3 4-2 7 0 7s3-3 0-7z" fill="#fff3a0"/></g>`;
  }
  candles.innerHTML = cs;

  /* ---------- Corazón: letras que corren por el contorno ---------- */
  const canvas = document.getElementById("h");
  const ctx = canvas.getContext("2d");
  const core = document.getElementById("core");
  const nameEl = document.getElementById("name");
  const btn = document.getElementById("btn");
  const fc = document.getElementById("f");
  const fx = fc.getContext("2d");
  let W, H, u, cx, cy;

  const N = 720, pts = [], cum = [0];
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 2;
    pts.push({
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.3
    });
    if (i > 0) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  const PERIM = cum[N];

  function pathAt(d) {
    d = ((d % PERIM) + PERIM) % PERIM;
    let lo = 0, hi = N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
    const a = pts[lo], b = pts[lo + 1], f = (d - cum[lo]) / ((cum[lo + 1] - cum[lo]) || 1);
    const dx = b.x - a.x, dy = b.y - a.y;
    return { x: a.x + dx * f, y: a.y + dy * f, ang: Math.atan2(dy, dx) };
  }

  function resize() {
    W = canvas.width = innerWidth * DPR;
    H = canvas.height = innerHeight * DPR;
    fc.width = W; fc.height = H;
    u = Math.min(W * 0.95 / 34, H * 0.55 / 30);
    cx = W / 2; cy = H * 0.38;
    const px = u / DPR;
    nameEl.style.fontSize = (px * 2.1) + "px";
    core.style.top = (cy / DPR - px * 0.6) + "px";
    btn.style.fontSize = Math.max(12, px * 0.95) + "px";
  }

  function draw(time) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const fontPx = u * 1.55;
    ctx.font = `700 ${fontPx}px Quicksand, sans-serif`;

    // Medidas de cada letra, ajustadas para que la frase encaje exacto en el contorno
    const chars = [...FRASE];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);

    ROWS.forEach(row => {
      const L = PERIM * row.s * u;                // largo real del contorno en píxeles
      const reps = Math.max(1, Math.round(L / total));
      const k = L / (reps * total);               // estira un poco para que no haya huecos
      const shift = (time / 1000) * VELOCIDAD * u * 0.05;
      ctx.fillStyle = row.color;
      ctx.shadowColor = row.color;
      ctx.shadowBlur = 8 * DPR;

      let x = 0;
      for (let r = 0; r < reps; r++) {
        for (let i = 0; i < chars.length; i++) {
          const adv = widths[i] * k;
          if (chars[i] !== " ") {
            const p = pathAt((x + adv / 2 + shift) / (row.s * u));
            ctx.save();
            ctx.translate(cx + p.x * row.s * u, cy + p.y * row.s * u);
            ctx.rotate(p.ang);
            ctx.fillText(chars[i], 0, 0);
            ctx.restore();
          }
          x += adv;
        }
      }
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  /* ---------- Confeti que sale de las cornetas ---------- */
  let bits = [], running = false, last = 0;
  const CONF = ["#ff4f9a", "#ffe27a", "#5ec8ff", "#b58cff", "#6ee7a8", "#ffffff", "#ff9a3c"];

  function mouthPos(id) {
    const r = document.querySelector("#" + id + " .mouth").getBoundingClientRect();
    return { x: (r.left + r.width / 2) * DPR, y: (r.top + r.height / 2) * DPR };
  }

  function shoot() {
    ["popL", "popR"].forEach((id, side) => {
      const m = mouthPos(id);
      for (let i = 0; i < 80; i++) {
        const deg = 35 + Math.random() * 45;
        const ang = -(side === 0 ? deg : 180 - deg) * Math.PI / 180;
        const sp = H * (0.9 + Math.random() * 0.9);
        bits.push({
          x: m.x, y: m.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          w: (6 + Math.random() * 7) * DPR, h: (4 + Math.random() * 5) * DPR,
          r: Math.random() * 6.28, vr: (Math.random() - .5) * 14,
          fl: Math.random() * 6.28, col: CONF[(Math.random() * CONF.length) | 0],
          round: Math.random() < .25
        });
      }
      const el = document.getElementById(id);
      el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }

  function tick(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    fx.clearRect(0, 0, W, H);
    const g = H * 1.5, drag = Math.pow(0.4, dt);
    bits = bits.filter(b => b.y < H + 40);
    for (const b of bits) {
      b.vx *= drag; b.vy = b.vy * drag + g * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt; b.fl += 9 * dt;
      fx.save();
      fx.translate(b.x, b.y); fx.rotate(b.r); fx.scale(1, Math.cos(b.fl));
      fx.fillStyle = b.col;
      if (b.round) { fx.beginPath(); fx.arc(0, 0, b.h / 1.4, 0, 6.283); fx.fill(); }
      else fx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      fx.restore();
    }
    if (bits.length) requestAnimationFrame(tick);
    else { running = false; fx.clearRect(0, 0, W, H); }
  }

  btn.addEventListener("click", () => { shoot(); setTimeout(shoot, 250); setTimeout(shoot, 500); });

  addEventListener("resize", resize);
  resize();
  const start = () => requestAnimationFrame(draw);
  (document.fonts && document.fonts.load ? document.fonts.load("700 20px Quicksand") : Promise.resolve()).then(start, start);
</script>
</body>
</html>
