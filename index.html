  .core { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 5; }
  .core h1 { margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: 32px; line-height: 1; color: #ffe27a; text-shadow: 0 0 14px #ff4f9a, 0 0 34px #ff4f9a; white-space: nowrap; animation: glow 2.4s ease-in-out infinite alternate; }

  #btn:active { transform: scale(.94); }
  #btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .balloon { position: absolute; animation: bob 4s ease-in-out infinite; z-index: 2; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-20px) rotate(3deg); } }
  .cake { position: absolute; bottom: 1.5%; left: 50%; transform: translateX(-50%); width: clamp(150px, 28vw, 250px); z-index: 2; }

      <path d="M22-8.25L34-12.75V12.75L22 8.25Z M46-17.25L58-21.75V21.75L46 17.25Z" fill="#ff5f9e"/>
      <ellipse cx="80" cy="0" rx="12" ry="30" fill="#4a6fc9"/>
      <path d="M14-6L60-22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <circle class="mouth" cx="80" cy="0" r="1" fill="none"/>
    </g></svg>`;
  document.getElementById("popL").innerHTML = popperSVG;
  document.getElementById("popR").innerHTML = popperSVG;

  /* ---------- Torta de 3 pisos ---------- */
  const body = document.getElementById("cakeBody");
  const tiers = [
    { x: 20, y: 160, w: 220, h: 62, c: "#ff7fb5", f: "#ffffff" },
    { x: 48, y: 110, w: 164, h: 50, c: "#ffb3d1", f: "#ffffff" },
    { x: 76, y: 62,  w: 108, h: 48, c: "#fff0f6", f: "#ff7fb5" }
  ];
  let svgBody = "";
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const sprinkleColors = ["#ffe27a", "#5ec8ff", "#b58cff", "#6ee7a8", "#ff4f9a"];
  tiers.forEach(t => {
    svgBody += `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="8" fill="${t.c}"/>`;
    svgBody += `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="7" rx="3" fill="${t.f}"/>`;
    const n = Math.floor(t.w / 18), sp = t.w / n;
    for (let i = 0; i < n; i++) svgBody += `<circle cx="${t.x + sp / 2 + i * sp}" cy="${t.y + 7}" r="${sp / 2 - 0.5}" fill="${t.f}"/>`;
    for (let i = 0; i < 12; i++) {
      const sx = t.x + 8 + rnd() * (t.w - 16), sy = t.y + 22 + rnd() * (t.h - 30);
      svgBody += `<rect x="${sx}" y="${sy}" width="6" height="2.4" rx="1.2" fill="${sprinkleColors[i % 5]}" transform="rotate(${rnd() * 180} ${sx} ${sy})"/>`;
    }
  });
  [[34,154],[226,154],[62,104],[198,104]].forEach(([x, y]) => {
    svgBody += `<circle cx="${x}" cy="${y}" r="8" fill="#e8143c"/><circle cx="${x - 3}" cy="${y - 3}" r="2.2" fill="#fff" opacity=".7"/><path d="M${x} ${y - 8}q4 -8 9 -9" stroke="#3aa55d" stroke-width="2" fill="none"/>`;
  });
  body.innerHTML = svgBody;

  const candles = document.getElementById("candles");
  let cs = "";
  for (let i = 0; i < 7; i++) {
    const x = 88 + i * 15, col = i % 2 ? "#5ec8ff" : "#ffd1e6";
    cs += `<rect x="${x - 3}" y="38" width="6" height="24" rx="2" fill="${col}"/>
           <g class="flame" style="animation-delay:${-(i * 0.11).toFixed(2)}s"><path d="M${x} 24c-6 8-4 13 0 13s6-5 0-13z" fill="#ffb22e"/><path d="M${x} 29c-3 4-2 7 0 7s3-3 0-7z" fill="#fff3a0"/></g>`;
  }
  candles.innerHTML = cs;

  /* ---------- Corazón: letras que corren por el contorno ---------- */
  const canvas = document.getElementById("h");
  const ctx = canvas.getContext("2d");
  const core = document.getElementById("core");
  const nameEl = document.getElementById("name");
  const btn = document.getElementById("btn");
  const fc = document.getElementById("f");
  const fx = fc.getContext("2d");
  let W, H, u, cx, cy;

  const N = 720, pts = [], cum = [0];
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 2;
    pts.push({
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.3
    });
    if (i > 0) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  const PERIM = cum[N];

  function pathAt(d) {
    d = ((d % PERIM) + PERIM) % PERIM;
    let lo = 0, hi = N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
    const a = pts[lo], b = pts[lo + 1], f = (d - cum[lo]) / ((cum[lo + 1] - cum[lo]) || 1);
    const dx = b.x - a.x, dy = b.y - a.y;
    return { x: a.x + dx * f, y: a.y + dy * f, ang: Math.atan2(dy, dx) };
  }

  function resize() {
    W = canvas.width = innerWidth * DPR;
    H = canvas.height = innerHeight * DPR;
    fc.width = W; fc.height = H;
    u = Math.min(W * 0.95 / 34, H * 0.55 / 30);
    cx = W / 2; cy = H * 0.38;
    const px = u / DPR;
    nameEl.style.fontSize = (px * 2.1) + "px";
    core.style.top = (cy / DPR - px * 0.6) + "px";
    btn.style.fontSize = Math.max(12, px * 0.95) + "px";
  }

  function draw(time) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const fontPx = u * 1.55;
    ctx.font = `700 ${fontPx}px Quicksand, sans-serif`;

    // Medidas de cada letra, ajustadas para que la frase encaje exacto en el contorno
    const chars = [...FRASE];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);

    ROWS.forEach(row => {
      const L = PERIM * row.s * u;                // largo real del contorno en píxeles
      const reps = Math.max(1, Math.round(L / total));
      const k = L / (reps * total);               // estira un poco para que no haya huecos
      const shift = (time / 1000) * VELOCIDAD * u * 0.05;
      ctx.fillStyle = row.color;
      ctx.shadowColor = row.color;
      ctx.shadowBlur = 8 * DPR;

      let x = 0;
      for (let r = 0; r < reps; r++) {
        for (let i = 0; i < chars.length; i++) {
          const adv = widths[i] * k;
          if (chars[i] !== " ") {
            const p = pathAt((x + adv / 2 + shift) / (row.s * u));
            ctx.save();
            ctx.translate(cx + p.x * row.s * u, cy + p.y * row.s * u);
            ctx.rotate(p.ang);
            ctx.fillText(chars[i], 0, 0);
            ctx.restore();
          }
          x += adv;
        }
      }
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  /* ---------- Confeti que sale de las cornetas ---------- */
  let bits = [], running = false, last = 0;
  const CONF = ["#ff4f9a", "#ffe27a", "#5ec8ff", "#b58cff", "#6ee7a8", "#ffffff", "#ff9a3c"];

  function mouthPos(id) {
    const r = document.querySelector("#" + id + " .mouth").getBoundingClientRect();
    return { x: (r.left + r.width / 2) * DPR, y: (r.top + r.height / 2) * DPR };
  }

  function shoot() {
    ["popL", "popR"].forEach((id, side) => {
      const m = mouthPos(id);
      for (let i = 0; i < 80; i++) {
        const deg = 35 + Math.random() * 45;
        const ang = -(side === 0 ? deg : 180 - deg) * Math.PI / 180;
        const sp = H * (0.9 + Math.random() * 0.9);
        bits.push({
          x: m.x, y: m.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          w: (6 + Math.random() * 7) * DPR, h: (4 + Math.random() * 5) * DPR,
          r: Math.random() * 6.28, vr: (Math.random() - .5) * 14,
          fl: Math.random() * 6.28, col: CONF[(Math.random() * CONF.length) | 0],
          round: Math.random() < .25
        });
      }
      const el = document.getElementById(id);
      el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }

  function tick(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    fx.clearRect(0, 0, W, H);
    const g = H * 1.5, drag = Math.pow(0.4, dt);
    bits = bits.filter(b => b.y < H + 40);
    for (const b of bits) {
      b.vx *= drag; b.vy = b.vy * drag + g * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt; b.fl += 9 * dt;
      fx.save();
      fx.translate(b.x, b.y); fx.rotate(b.r); fx.scale(1, Math.cos(b.fl));
      fx.fillStyle = b.col;
      if (b.round) { fx.beginPath(); fx.arc(0, 0, b.h / 1.4, 0, 6.283); fx.fill(); }
      else fx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      fx.restore();
    }
    if (bits.length) requestAnimationFrame(tick);
    else { running = false; fx.clearRect(0, 0, W, H); }
  }

  btn.addEventListener("click", () => { shoot(); setTimeout(shoot, 250); setTimeout(shoot, 500); });

  /* ---------- Gatito animado (si no carga, queda la foto fija) ---------- */
  const GIF_URL = "https://media.tenor.com/QpjvU-DUe50AAAAi/scuba-cat.gif";
  const gifImg = new Image();
  gifImg.onload = () => {
    document.documentElement.style.setProperty("--cat", `url("${GIF_URL}")`);
    document.documentElement.classList.add("gif");
  };
  gifImg.src = GIF_URL;

  addEventListener("resize", resize);
  resize();
  const start = () => requestAnimationFrame(draw);
  (document.fonts && document.fonts.load ? document.fonts.load("700 20px Quicksand") : Promise.resolve()).then(start, start);
</script>
</body>
</html>
